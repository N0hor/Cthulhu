entry_port: 8080
port_to_redirect_to_after_verification: 9000
host_to_redirect_to_after_verification: "demo_app"

paths:
  "/":
    GET:
      query:
        a:
          allowed_chars: "0123456789"
          max_length: 4
          allow_empty: false
        b:
          allowed_chars: "0123456789"
          max_length: 4
          allow_empty: false
    PUT:
      query:
        c:
          allowed_chars: "abcdefgh"
          max_length: 10
          allow_empty: false

  "/send_msg_form":
    POST:
      body:
        content_type: "application/x-www-form-urlencoded"
        parameters:
          msg:
            allowed_chars: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-"
            max_length: 50
            allow_empty: false

  "/send_msg_json":
    POST:
      body:
        content_type: "application/json"
        parameters:
          msg:
            allowed_chars: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-"
            max_length: 50
            allow_empty: false

  "/send_msg_with_query":
    POST:
      query:
        z:
          allowed_chars: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
          max_length: 20
          allow_empty: false
      body:
        content_type: "application/x-www-form-urlencoded"
        parameters:
          msg:
            allowed_chars: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-"
            max_length: 50
            allow_empty: false